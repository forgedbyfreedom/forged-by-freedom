#!/usr/bin/env python3
import os
import csv
from glob import glob

BASE_DIR = os.path.dirname(os.path.abspath(__file__))
ROOT = os.path.abspath(os.path.join(BASE_DIR, ".."))
TRANSCRIPTS_DIR = os.path.join(ROOT, "transcripts")
OUTPUT_CSV = os.path.join(ROOT, "episode_index.csv")

if not os.path.isdir(TRANSCRIPTS_DIR):
    raise RuntimeError(f"Missing transcripts directory: {TRANSCRIPTS_DIR}")

rows = []
episode_id = 1

for channel in sorted(os.listdir(TRANSCRIPTS_DIR)):
    channel_path = os.path.join(TRANSCRIPTS_DIR, channel)
    if not os.path.isdir(channel_path):
        continue

    txt_files = glob(os.path.join(channel_path, "**", "*.txt"), recursive=True)

    for fpath in txt_files:
        try:
            with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                text = f.read()
                word_count = len(text.split())
        except Exception:
            continue

        rows.append({
            "episode_id": episode_id,
            "channel": channel,
            "episode_title": os.path.splitext(os.path.basename(fpath))[0],
            "word_count": word_count,
        })
        episode_id += 1

if not rows:
    raise RuntimeError("No episodes found — episode_index.csv would be empty")

with open(OUTPUT_CSV, "w", newline="", encoding="utf-8") as f:
    writer = csv.DictWriter(
        f,
        fieldnames=["episode_id", "channel", "episode_title", "word_count"]
    )
    writer.writeheader()
    writer.writerows(rows)

print(f"✅ episode_index.csv created with {len(rows)} rows")
print(f"📄 Location: {OUTPUT_CSV}")

name: Auto-Rebuild & Send to Wix

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  rebuild-ingest:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Clone transcript source (thinkbig-transcripts)
      env:
        GH_PAT: ${{ secrets.FBF_PAT }}
      run: |
        git clone https://forgedbyfreedom:${GH_PAT}@github.com/forgedbyfreedom/thinkbig-transcripts.git ./ingest/channels

    - name: Install Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Rebuild master transcripts
      run: |
        python ingest/rebuild_master.py

    - name: Upload artifact (optional)
      uses: actions/upload-artifact@v4
      with:
        name: transcripts
        path: output/

    - name: Send to Wix ingest endpoint
      env:
        WIX_INGEST_URL: ${{ secrets.WIX_INGEST_URL }}
        WIX_INGEST_SECRET: ${{ secrets.WIX_INGEST_SECRET }}
      run: |
        for f in output/*; do
          CHANNEL=$(basename "$f" | cut -d'_' -f1)
          echo "🚚 Sending $f for channel $CHANNEL"
          curl -X POST "$WIX_INGEST_URL?channel=$CHANNEL" \
            -H "Content-Type: text/plain" \
            -H "x-fbf-secret: $WIX_INGEST_SECRET" \
            --data-binary @"$f"
        done

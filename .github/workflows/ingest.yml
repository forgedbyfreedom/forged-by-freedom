name: GitHub → Pinecone Ingest (Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ DEBUG — Show requirements file and tree
      - name: 🧪 DEBUG – Show requirements file
        run: |
          echo "PWD:"
          pwd
          echo
          echo "TREE (ingest/):"
          ls -R ingest | head -n 50
          echo
          echo "CONTENTS OF ingest/requirements.txt:"
          if [ -f ingest/requirements.txt ]; then
            nl -ba ingest/requirements.txt
          else
            echo "❌ ingest/requirements.txt NOT FOUND"
          fi

      # 3️⃣ Set up Python (single runtime)
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4️⃣ Upgrade pip
      - name: ⬆️ Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 5️⃣ Install dependencies explicitly (no -r)
      - name: 📦 Install dependencies
        run: |
          python -m pip install --no-cache-dir \
            openai \
            pinecone \
            PyYAML

      # 6️⃣ Verify PyYAML (hard stop if broken)
      - name: 🔍 Verify PyYAML installation
        run: |
          python - <<'EOF'
          import yaml
          print("✅ PyYAML loaded successfully")
          print("PyYAML version:", yaml.__version__)
          EOF

      # 7️⃣ Verify secrets
      - name: 🔐 Verify required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          [ -z "$OPENAI_API_KEY" ] && echo "❌ OPENAI_API_KEY missing" && exit 1
          [ -z "$PINECONE_API_KEY" ] && echo "❌ PINECONE_API_KEY missing" && exit 1
          [ -z "$PINECONE_HOST" ] && echo "❌ PINECONE_HOST missing" && exit 1
          echo "✅ All required secrets present"

      # 8️⃣ Run Pinecone ingest
      - name: 🚀 Run Pinecone ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          python ingest/ingest_to_pinecone.py

      # 9️⃣ Post-ingest stats
      - name: 📊 Pinecone post-ingest verification
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          python ingest/pinecone_stats.py

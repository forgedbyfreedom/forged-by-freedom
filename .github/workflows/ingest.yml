name: Nightly VPS RAG Ingest
 
# Sends transcript text to the OVH AI service /ingest endpoint, which chunks,
# embeds (its own OpenAI key) and upserts into Qdrant (collection fbf_pinecone).
# Replaces the old WordPress /rag/upsert path, which targeted the wrong store
# and returned HTTP 520 every run. INCREMENTAL: a cached sha1 state file means
# only new/changed transcripts are sent, so nightly runs are cheap.
#
# Required repo secret (Settings > Secrets and variables > Actions):
#   FBF_AI_API_KEY  - the AI service key (same value WordPress uses)
# Optional repo secret:
#   FBF_AI_URL      - defaults to https://ai.serverborn.com if unset
# Optional repo variable:
#   MAX_CHUNKS_PER_RUN - cap files sent per run (0/unset = no cap)
 
on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"   # Nightly at 01:00 UTC
 
concurrency:
  group: fbf-rag-ingest
  cancel-in-progress: false
 
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
 
      - name: Restore incremental state
        uses: actions/cache/restore@v4
        with:
          path: ingest/.vps_ingest_state.json
          key: fbf-vps-ingest-state-${{ github.run_id }}
          restore-keys: |
            fbf-vps-ingest-state-
 
      - name: Verify secret
        env:
          FBF_AI_API_KEY: ${{ secrets.FBF_AI_API_KEY }}
        run: |
          if [ -z "$FBF_AI_API_KEY" ]; then echo "FBF_AI_API_KEY missing"; exit 1; fi
          echo "Secret present."
 
      - name: Ingest to VPS (Qdrant via /ingest)
        env:
          FBF_AI_URL: ${{ secrets.FBF_AI_URL }}
          FBF_AI_API_KEY: ${{ secrets.FBF_AI_API_KEY }}
          MAX_CHUNKS_PER_RUN: ${{ vars.MAX_CHUNKS_PER_RUN }}
        run: python ingest/ingest_to_vps.py
 
      - name: Save incremental state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ingest/.vps_ingest_state.json
          key: fbf-vps-ingest-state-${{ github.run_id }}
 

name: GitHub → Pinecone Ingest (Stable)

- name: 🧪 DEBUG – Show requirements file
  run: |
    echo "PWD:"
    pwd
    echo
    echo "TREE:"
    ls -R ingest | head -n 50
    echo
    echo "CONTENTS OF ingest/requirements.txt:"
    cat ingest/requirements.txt || echo "FILE NOT FOUND"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python (SINGLE runtime)
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Upgrade pip (important)
      - name: ⬆️ Upgrade pip
        run: |
          python -m pip install --upgrade pip

      # 4️⃣ Install ALL dependencies explicitly (NO ambiguity)
      - name: 📦 Install dependencies
        run: |
          python -m pip install --no-cache-dir \
            openai \
            pinecone \
            PyYAML

      # 5️⃣ Hard verify PyYAML BEFORE ingest (this is the key fix)
      - name: 🔍 Verify PyYAML installation
        run: |
          python - <<EOF
          import yaml
          print("✅ PyYAML loaded successfully")
          print("PyYAML version:", yaml.__version__)
          EOF

      # 6️⃣ Verify secrets are present
      - name: 🔐 Verify required secrets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          [ -z "$OPENAI_API_KEY" ] && echo "❌ OPENAI_API_KEY missing" && exit 1
          [ -z "$PINECONE_API_KEY" ] && echo "❌ PINECONE_API_KEY missing" && exit 1
          [ -z "$PINECONE_HOST" ] && echo "❌ PINECONE_HOST missing" && exit 1
          echo "✅ All required secrets present"

      # 7️⃣ Run Pinecone ingest
      - name: 🚀 Run Pinecone ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          python ingest/ingest_to_pinecone.py

      # 8️⃣ Post-ingest stats (optional but recommended)
      - name: 📊 Pinecone post-ingest verification
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
        run: |
          python ingest/pinecone_stats.py

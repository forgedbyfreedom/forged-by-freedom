name: GitHub → Pinecone Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_HOST: ${{ secrets.PINECONE_HOST }}

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip uninstall -y pinecone-client || true
          pip install --no-cache-dir openai pinecone

      - name: 🔍 Verify secrets
        run: |
          [ -z "$OPENAI_API_KEY" ] && echo "❌ OPENAI_API_KEY missing" && exit 1
          [ -z "$PINECONE_API_KEY" ] && echo "❌ PINECONE_API_KEY missing" && exit 1
          [ -z "$PINECONE_HOST" ] && echo "❌ PINECONE_HOST missing" && exit 1
          echo "✅ All required secrets present"

      - name: 🚀 Run ingest
        run: |
          python ingest/ingest_to_pinecone.py

      - name: 📊 Verify Pinecone stats
        run: |
          python ingest/pinecone_stats.py


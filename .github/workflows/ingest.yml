name: GitHub → Pinecone Ingest (Stable)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_HOST: ${{ secrets.PINECONE_HOST }}
      PINECONE_INDEX: forged-freedom-ai

    steps:
      # 1️⃣ Checkout repository
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Set up Python
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Upgrade pip
      - name: ⬆️ Upgrade pip
        run: |
          python -m pip install --upgrade pip
          python -m pip --version

      # 4️⃣ DEBUG – show repo layout
      - name: 🧪 DEBUG – Show ingest tree
        run: |
          echo "PWD:"
          pwd
          echo
          echo "ingest directory:"
          ls -la ingest || true
          echo
          echo "channels count:"
          ls ingest/channels | wc -l || true
          echo
          echo "manifest files:"
          ls ingest/channel_manifest.* || true

      # 5️⃣ Install dependencies
      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --no-cache-dir \
            openai \
            pinecone \
            PyYAML \
            requests \
            tqdm

      # 6️⃣ Verify PyYAML
      - name: 🔍 Verify PyYAML import
        run: |
          python - <<'EOF'
          import yaml
          print("✅ PyYAML OK:", yaml.__version__)
          EOF

      # 7️⃣ Verify required secrets
      - name: 🔐 Verify secrets
        run: |
          [ -z "$OPENROUTER_API_KEY" ] && echo "❌ OPENROUTER_API_KEY missing" && exit 1
          [ -z "$PINECONE_API_KEY" ] && echo "❌ PINECONE_API_KEY missing" && exit 1
          [ -z "$PINECONE_HOST" ] && echo "❌ PINECONE_HOST missing" && exit 1
          echo "✅ All required secrets present"

      # 8️⃣ Run ingest
      - name: 🚀 Run Pinecone ingest
        run: |
          python ingest/ingest_to_pinecone.py

      # 9️⃣ Pinecone stats
      - name: 📊 Pinecone post-ingest stats
        run: |
          python ingest/pinecone_stats.py

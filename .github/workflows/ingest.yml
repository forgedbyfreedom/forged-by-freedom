name: GitHub → Pinecone Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_HOST: ${{ secrets.PINECONE_HOST }}

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install ingest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r ingest/requirements.txt

      - name: 🔍 Verify PyYAML install
        run: |
          python - <<EOF
          import yaml
          print("✅ PyYAML import successful")
          EOF

      - name: 🚀 Run Pinecone ingest
        run: |
          python ingest/ingest_to_pinecone.py

      - name: 📊 Pinecone stats
        run: |
          python ingest/pinecone_stats.py


name: GitHub → Pinecone Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours

jobs:
  ingest:
    runs-on: ubuntu-latest

    - name: 📊 Pinecone post-ingest verification
    run: |
    python ingest/pinecone_stats.py

    steps:
      - name: Checkout forged-by-freedom
        uses: actions/checkout@v4

      - name: Clone transcript source
        env:
          GH_PAT: ${{ secrets.FBF_PAT }}
        run: |
          git clone https://forgedbyfreedom:${GH_PAT}@github.com/forgedbyfreedom/thinkbig-transcripts.git ingest/channels

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          pip install openai pinecone

      - name: Run ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX: ${{ secrets.PINECONE_INDEX }}
        run: |
          python ingest/ingest_to_pinecone.py

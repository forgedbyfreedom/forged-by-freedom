name: GitHub → Pinecone Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

jobs:
  ingest:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_HOST: ${{ secrets.PINECONE_HOST }}

    steps:
      - name: 🧩 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          pip uninstall -y pinecone-client || true
          pip uninstall -y pinecone || true
          pip install --no-cache-dir openai pinecone

      - name: 🔍 Verify environment
        run: |
          python - <<EOF
          import os
          assert os.getenv("OPENAI_API_KEY"), "Missing OPENAI_API_KEY"
          assert os.getenv("PINECONE_API_KEY"), "Missing PINECONE_API_KEY"
          assert os.getenv("PINECONE_HOST"), "Missing PINECONE_HOST"
          print("✅ All required environment variables present")
          EOF

      - name: 🚀 Run Pinecone ingest
        run: |
          python ingest/ingest_to_pinecone.py

      - name: 📊 Pinecone stats
        run: |
          python ingest/pinecone_stats.py


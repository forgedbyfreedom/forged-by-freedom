name: 🧠 OpenRouter + Pinecone Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # Run every day at midnight UTC
    - cron: "0 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # === OpenRouter ===
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
      OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
      OPENROUTER_EMBED_MODEL: ${{ secrets.OPENROUTER_EMBED_MODEL }}

      # === Pinecone ===
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
      PINECONE_PROJECT: ${{ secrets.PINECONE_PROJECT }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      # === Flask / App settings ===
      PORT: 5051

    steps:
      # -------------------------------
      # 🧩 Step 1: Checkout the repo
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------
      # 🐍 Step 2: Setup Python
      # -------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      # -------------------------------
      # 📦 Step 3: Install dependencies
      # -------------------------------
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install openai pinecone-client flask flask-cors python-dotenv tqdm requests

      # -------------------------------
      # 🧠 Step 4: Verify environment
      # -------------------------------
      - name: Verify environment variables
        run: |
          echo "🔍 Checking environment setup..."
          echo "OPENROUTER_MODEL: ${OPENROUTER_MODEL}"
          echo "PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME}"
          echo "PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT}"
          echo "PINECONE_PROJECT: ${PINECONE_PROJECT}"
          echo "✅ Environment variables appear loaded."

      # -------------------------------
      # 🌐 Step 5: Verify Pinecone connection
      # -------------------------------
      - name: ✅ Verify Pinecone connection
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
        run: |
          python3 - <<'PYCODE'
          from pinecone import Pinecone
          import os
          api_key = os.getenv("PINECONE_API_KEY")
          env = os.getenv("PINECONE_ENVIRONMENT", "gcp-starter")
          print(f"🔑 Using Pinecone key prefix: {api_key[:10]}..., environment: {env}")
          try:
              pc = Pinecone(api_key=api_key, environment=env)
              indexes = [i["name"] for i in pc.list_indexes()]
              print("✅ Pinecone connection OK. Found indexes:", indexes)
          except Exception as e:
              print("❌ Pinecone connection failed:", e)
              raise
          PYCODE

      # -------------------------------
      # 💬 Step 6: Verify OpenRouter connection
      # -------------------------------
      - name: ✅ Verify OpenRouter connection
        run: |
          python3 - <<'PYCODE'
          import os, requests
          api_key = os.getenv("OPENROUTER_API_KEY")
          base_url = os.getenv("OPENROUTER_BASE_URL", "https://openrouter.ai/api/v1")
          print(f"🔑 Testing OpenRouter connection... Using prefix: {api_key[:10]}...")
          headers = {"Authorization": f"Bearer {api_key}"}
          try:
              response = requests.get(f"{base_url}/models", headers=headers, timeout=10)
              if response.status_code == 200:
                  print("✅ OpenRouter connection OK. Models available:", len(response.json().get("data", [])))
              else:
                  print("❌ OpenRouter connection failed:", response.status_code, response.text)
          except Exception as e:
              print("❌ OpenRouter error:", e)
              raise
          PYCODE

      # -------------------------------
      # 🔄 Step 7: Run sync script
      # -------------------------------
      - name: Run OpenRouter → Pinecone Sync
        run: |
          echo "🚀 Starting sync process..."
          python3 scripts/smart_pinecone_sync.py || echo "⚠️ Sync script completed with warnings."

      # -------------------------------
      # ✅ Step 8: Finish
      # -------------------------------
      - name: Complete
        run: echo "🎉 Workflow completed successfully!"

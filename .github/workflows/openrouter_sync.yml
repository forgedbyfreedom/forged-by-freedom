name: 🧠 OpenRouter + Pinecone Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/openrouter_sync.yml"
      - "backend/**"
      - "sync_*.py"
      - "transcripts/**"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Clean + Install Dependencies
        run: |
          echo "🧹 Cleaning environment..."
          pip uninstall -y pinecone pinecone-client pinecone-plugin-* || true
          pip cache purge || true
          rm -rf ~/.cache/pip ~/.local/lib/python*/site-packages/pinecone* || true

          echo "📦 Installing clean dependencies..."
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir pinecone openai python-dotenv tqdm flask flask-cors requests numpy

          echo "✅ SDK Versions:"
          python3 -c "import pinecone, openai; print('Pinecone:', pinecone.__version__, '| OpenAI:', openai.__version__)"

      - name: 📡 Verify Environment Variables
        run: |
          echo "✅ OPENROUTER_MODEL: $OPENROUTER_MODEL"
          echo "✅ PINECONE_INDEX_NAME: $PINECONE_INDEX_NAME"
          echo "✅ PINECONE_ENVIRONMENT: $PINECONE_ENVIRONMENT"
        env:
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}

      - name: ✅ Verify Pinecone Connection
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python3 - <<'PYCODE'
          import os
          from pinecone import Pinecone

          api_key = os.getenv("PINECONE_API_KEY")
          env = os.getenv("PINECONE_ENVIRONMENT", "us-east-1-aws")
          index_name = os.getenv("PINECONE_INDEX_NAME")

          print(f"🔑 Using Pinecone key prefix: {api_key[:10]}... | Env: {env}")
          if not api_key:
              raise ValueError("❌ Missing Pinecone API key — check GitHub Secrets")

          try:
              pc = Pinecone(api_key=api_key, environment=env)
              indexes = [i["name"] for i in pc.list_indexes()]
              print("✅ Pinecone connection successful — Indexes:", indexes)

              if index_name in [i["name"] for i in indexes]:
                  print(f"✅ Index '{index_name}' exists.")
              else:
                  print(f"⚠️ Index '{index_name}' not found.")
          except Exception as e:
              print("❌ Pinecone connection failed:", e)
              raise
          PYCODE

      - name: 🔌 Test OpenRouter + Pinecone Integration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python3 - <<'PYCODE'
          import os
          from openai import OpenAI
          from pinecone import Pinecone

          print("🔍 Testing OpenRouter + Pinecone integration...")

          openrouter_key = os.getenv("OPENROUTER_API_KEY")
          base_url = os.getenv("OPENROUTER_BASE_URL", "https://openrouter.ai/api/v1")
          pinecone_key = os.getenv("PINECONE_API_KEY")
          pinecone_env = os.getenv("PINECONE_ENVIRONMENT", "us-east-1-aws")
          index_name = os.getenv("PINECONE_INDEX_NAME")

          try:
              client = OpenAI(api_key=openrouter_key, base_url=base_url)
              emb = client.embeddings.create(
                  model="text-embedding-3-small",
                  input="connectivity test"
              ).data[0].embedding
              print("✅ OpenRouter test OK — Embedding length:", len(emb))
          except Exception as e:
              print("⚠️ OpenRouter test failed:", e)

          try:
              pc = Pinecone(api_key=pinecone_key, environment=pinecone_env)
              index = pc.Index(index_name)
              stats = index.describe_index_stats()
              print("✅ Pinecone index connected — Stats:", stats)
          except Exception as e:
              print("❌ Pinecone index connection failed:", e)
              raise
          PYCODE

      - name: 📤 Sync Transcripts to Pinecone
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          echo "🚀 Syncing transcripts to Pinecone..."
          python3 sync_transcripts_to_pinecone.py || echo "⚠️ Sync script missing — skipping upload."

      - name: 🌐 Notify Wix (Zapier)
        if: success()
        run: |
          echo "📢 Notifying Wix/Zapier of successful sync..."
          curl -X POST "https://hooks.zapier.com/hooks/catch/YOUR_ZAPIER_ID_HERE" \
            -H "Content-Type: application/json" \
            -d '{"status":"success","message":"OpenRouter + Pinecone sync completed"}'

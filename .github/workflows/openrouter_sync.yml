name: 🧠 OpenRouter + Pinecone Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Full Clean Install of Dependencies
        run: |
          echo "🧹 Cleaning environment..."
          pip uninstall -y pinecone pinecone-client || true
          pip cache purge || true

          echo "📦 Installing clean dependencies..."
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir openai pinecone-client python-dotenv tqdm flask flask-cors requests numpy

          echo "✅ Verifying Pinecone SDK version..."
          python3 -c "import pinecone; print('✅ Pinecone SDK version:', pinecone.__version__)"

      - name: 📡 Verify Environment Variables
        run: |
          echo "✅ Model: $OPENROUTER_MODEL"
          echo "✅ Pinecone Index: $PINECONE_INDEX_NAME"
          echo "✅ Pinecone Environment: $PINECONE_ENVIRONMENT"
          echo "✅ Pinecone Project: $PINECONE_PROJECT"
          echo "✅ OpenRouter Base URL: $OPENROUTER_BASE_URL"
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_PROJECT: ${{ secrets.PINECONE_PROJECT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}

      - name: 🔍 Validate Flask App Import
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python3 -c "from app import app; print('✅ Flask app loaded successfully')"

      - name: ✅ Verify Pinecone Connection
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_PROJECT: ${{ secrets.PINECONE_PROJECT }}
        run: |
          python3 - <<'PYCODE'
          from pinecone import Pinecone
          import os

          api_key = os.getenv("PINECONE_API_KEY")
          env = os.getenv("PINECONE_ENVIRONMENT", "gcp-starter")
          project = os.getenv("PINECONE_PROJECT", "default")

          print(f"🔑 Using Pinecone key prefix: {api_key[:10]}... | Env: {env} | Project: {project}")

          try:
              pc = Pinecone(api_key=api_key, environment=env)
              indexes = [i["name"] for i in pc.list_indexes()]
              print("✅ Pinecone connection successful. Indexes:", indexes)
          except Exception as e:
              print("❌ Pinecone connection failed:", e)
              raise
          PYCODE

      - name: 🔌 Test OpenRouter + Pinecone Integration
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: ${{ secrets.OPENROUTER_BASE_URL }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENVIRONMENT: ${{ secrets.PINECONE_ENVIRONMENT }}
          PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
        run: |
          python3 - <<'PYCODE'
          from openai import OpenAI
          from pinecone import Pinecone
          import os

          print("🔍 Testing OpenRouter + Pinecone connections...")

          openrouter_key = os.getenv("OPENROUTER_API_KEY")
          base_url = os.getenv("OPENROUTER_BASE_URL", "https://openrouter.ai/api/v1")
          pinecone_key = os.getenv("PINECONE_API_KEY")
          pinecone_env = os.getenv("PINECONE_ENVIRONMENT", "gcp-starter")
          index_name = os.getenv("PINECONE_INDEX_NAME")

          try:
              client = OpenAI(api_key=openrouter_key, base_url=base_url)
              emb = client.embeddings.create(model="text-embedding-3-small", input="connection test").data[0].embedding
              print("✅ OpenRouter embedding test successful — vector length:", len(emb))
          except Exception as e:
              print("⚠️ OpenRouter test failed:", e)

          try:
              pc = Pinecone(api_key=pinecone_key, environment=pinecone_env)
              index = pc.Index(index_name)
              stats = index.describe_index_stats()
              print("✅ Pinecone index connected. Stats:", stats)
          except Exception as e:
              print("❌ Pinecone index connection failed:", e)
              raise
          PYCODE

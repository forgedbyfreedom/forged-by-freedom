name: Update Site Stats

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "transcripts/**"
      - "scripts/update_stats.py"
      - "scripts/build_file_index.py"

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------
      # Checkout
      # -------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------
      # Python
      # -------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # -------------------------------
      # Dependencies (minimal)
      # -------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tqdm numpy python-dotenv

      # -------------------------------
      # Build authoritative stats
      # -------------------------------
      - name: Build transcript stats
        run: python scripts/build_file_index.py

      # -------------------------------
      # Commit stats only
      # -------------------------------
      - name: Commit updated stats
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add stats.json transcripts/transcripts_summary.json || true
          git diff --cached --quiet || git commit -m "Auto-update site stats"
          git push https://forgedbyfreedom:${GH_PAT}@github.com/forgedbyfreedom/forged-by-freedom.git main

      # -------------------------------
      # Done
      # -------------------------------
      - name: Confirm completion
        run: echo "Site stats updated successfully."

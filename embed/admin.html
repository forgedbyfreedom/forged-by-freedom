<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FBF Admin — Lead Management</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;
  --border:#2a2a2a;--accent:#ff6a00;--accent-glow:rgba(255,106,0,.15);
  --text:#e8e8e8;--text-dim:#aaa;--text-muted:#666;
  --success:#22c55e;--warning:#f59e0b;--danger:#ef4444;
  --radius:12px;--radius-sm:8px;
}
html,body{min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
body{padding:0}

.login-screen{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.login-box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:380px;text-align:center}
.login-box h2{font-size:20px;margin-bottom:16px;color:var(--accent)}
.login-box input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:15px;padding:12px 16px;outline:none;margin-bottom:12px}
.login-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.login-box button{width:100%;padding:12px;background:linear-gradient(135deg,var(--accent),#e05500);color:#fff;font-size:15px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer}
.login-box .error{color:var(--danger);font-size:13px;margin-top:8px;display:none}

.admin{display:none;max-width:900px;margin:0 auto;padding:24px 20px}
.admin.visible{display:block}

.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.admin-header h1{font-size:22px;font-weight:800;color:var(--accent)}
.admin-header .refresh-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:8px 16px;border-radius:var(--radius-sm);cursor:pointer;font-size:13px}
.admin-header .refresh-btn:hover{border-color:var(--accent);color:var(--text)}

.stats-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{flex:1;min-width:100px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:800;color:var(--accent)}
.stat-card .label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-top:4px}

.filter-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:12px;font-weight:600}
.filter-btn:hover,.filter-btn.active{border-color:var(--accent);color:var(--accent);background:var(--accent-glow)}

.lead-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;transition:border-color .2s}
.lead-card:hover{border-color:#333}
.lead-card.status-new{border-left:4px solid var(--warning)}
.lead-card.status-approved{border-left:4px solid var(--success)}
.lead-card.status-rejected{border-left:4px solid var(--danger)}

.lead-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.lead-name{font-size:18px;font-weight:700}
.lead-meta{font-size:12px;color:var(--text-muted)}
.lead-badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.badge-new{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-approved{background:rgba(34,197,94,.15);color:var(--success)}
.badge-rejected{background:rgba(239,68,68,.15);color:var(--danger)}

.lead-details{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:13px;margin-bottom:14px}
.lead-details dt{color:var(--text-muted);font-weight:600}
.lead-details dd{color:var(--text-dim);margin:0}

.lead-held-back{font-size:13px;color:var(--text-dim);margin-bottom:14px;padding:10px 14px;background:var(--surface2);border-radius:var(--radius-sm);line-height:1.5}
.lead-held-back strong{color:var(--text-muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}

.lead-actions{display:flex;gap:8px;flex-wrap:wrap}
.lead-actions button{padding:8px 18px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;border:none;cursor:pointer;transition:opacity .15s}
.btn-approve{background:var(--success);color:#fff}
.btn-reject{background:var(--danger);color:#fff}
.btn-copy-link{background:var(--surface2);border:1px solid var(--border);color:var(--text-dim)}
.btn-copy-link:hover{border-color:var(--accent);color:var(--text)}
.lead-actions button:disabled{opacity:.4;cursor:not-allowed}

.empty{text-align:center;padding:40px;color:var(--text-muted);font-size:14px}

.toast{position:fixed;bottom:20px;right:20px;background:var(--success);color:#fff;padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;display:none;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.toast.visible{display:block}

@media(max-width:600px){
  .lead-details{grid-template-columns:1fr}
  .stats-row{gap:8px}
  .stat-card{min-width:70px;padding:10px}
  .stat-card .num{font-size:22px}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>FBF Admin</h2>
    <input type="password" id="keyInput" placeholder="Admin Key" autofocus>
    <button onclick="doLogin()">Enter</button>
    <div class="error" id="loginError">Invalid key</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin" id="adminPanel">
  <div class="admin-header">
    <h1>Lead Management</h1>
    <button class="refresh-btn" onclick="loadLeads()">Refresh</button>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="num" id="statTotal">-</div><div class="label">Total</div></div>
    <div class="stat-card"><div class="num" id="statNew">-</div><div class="label">New</div></div>
    <div class="stat-card"><div class="num" id="statApproved">-</div><div class="label">Approved</div></div>
    <div class="stat-card"><div class="num" id="statRejected">-</div><div class="label">Rejected</div></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="new">New</button>
    <button class="filter-btn" data-filter="approved">Approved</button>
    <button class="filter-btn" data-filter="rejected">Rejected</button>
  </div>

  <div id="leadsContainer"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_BASE = window.location.origin.includes('localhost')
  ? 'http://localhost:5051'
  : 'https://forged-by-freedom-api-nm4f.onrender.com';

let adminKey = '';
let allLeads = [];
let currentFilter = 'all';

// Login
document.getElementById('keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function doLogin() {
  adminKey = document.getElementById('keyInput').value.trim();
  if (!adminKey) return;
  loadLeads().then(ok => {
    if (ok) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').classList.add('visible');
      localStorage.setItem('fbf_admin_key', adminKey);
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  });
}

// Auto-login from localStorage
const savedKey = localStorage.getItem('fbf_admin_key');
if (savedKey) {
  adminKey = savedKey;
  loadLeads().then(ok => {
    if (ok) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('adminPanel').classList.add('visible');
    }
  });
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderLeads();
  });
});

async function loadLeads() {
  try {
    const res = await fetch(API_BASE + '/api/leads?key=' + encodeURIComponent(adminKey));
    if (!res.ok) return false;
    const data = await res.json();
    allLeads = data.leads || [];
    updateStats();
    renderLeads();
    return true;
  } catch (err) {
    return false;
  }
}

function updateStats() {
  document.getElementById('statTotal').textContent = allLeads.length;
  document.getElementById('statNew').textContent = allLeads.filter(l => l.status === 'new').length;
  document.getElementById('statApproved').textContent = allLeads.filter(l => l.status === 'approved').length;
  document.getElementById('statRejected').textContent = allLeads.filter(l => l.status === 'rejected').length;
}

function renderLeads() {
  const container = document.getElementById('leadsContainer');
  const filtered = currentFilter === 'all' ? allLeads : allLeads.filter(l => l.status === currentFilter);

  if (!filtered.length) {
    container.innerHTML = '<div class="empty">No leads found</div>';
    return;
  }

  container.innerHTML = filtered.map(lead => {
    const date = new Date(lead.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    const badgeClass = lead.status === 'new' ? 'badge-new' : lead.status === 'approved' ? 'badge-approved' : 'badge-rejected';
    const onboardingLink = API_BASE + '/onboarding?token=' + lead.id;

    return `<div class="lead-card status-${lead.status}">
      <div class="lead-top">
        <div>
          <div class="lead-name">${esc(lead.name)}</div>
          <div class="lead-meta">${date}</div>
        </div>
        <span class="lead-badge ${badgeClass}">${lead.status}</span>
      </div>
      <dl class="lead-details">
        <dt>Email</dt><dd>${esc(lead.email)}</dd>
        <dt>Phone</dt><dd>${esc(lead.phone)}</dd>
        <dt>Goal</dt><dd>${esc(lead.primary_goal || '—')}</dd>
        <dt>Commitment</dt><dd>${esc(lead.commitment_level || '—')}</dd>
        <dt>Duration</dt><dd>${esc(lead.struggle_duration || '—')}</dd>
        <dt>Referral</dt><dd>${esc(lead.referral_source || '—')}</dd>
      </dl>
      ${lead.what_held_back ? `<div class="lead-held-back"><strong>What held them back</strong>${esc(lead.what_held_back)}</div>` : ''}
      <div class="lead-actions">
        ${lead.status === 'new' ? `
          <button class="btn-approve" onclick="updateStatus('${lead.id}','approved')">Approve</button>
          <button class="btn-reject" onclick="updateStatus('${lead.id}','rejected')">Reject</button>
        ` : ''}
        ${lead.status === 'approved' ? `
          <button class="btn-copy-link" onclick="copyLink('${onboardingLink}')">Copy Onboarding Link</button>
        ` : ''}
        ${lead.status === 'rejected' ? `
          <button class="btn-approve" onclick="updateStatus('${lead.id}','approved')">Reconsider → Approve</button>
        ` : ''}
      </div>
    </div>`;
  }).join('');
}

async function updateStatus(leadId, newStatus) {
  try {
    const res = await fetch(API_BASE + '/api/leads/' + leadId + '/status', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: newStatus, key: adminKey })
    });
    if (res.ok) {
      showToast(newStatus === 'approved' ? 'Lead approved' : 'Lead rejected');
      await loadLeads();
    } else {
      const data = await res.json();
      showToast(data.error || 'Failed to update', true);
    }
  } catch (err) {
    showToast('Network error', true);
  }
}

function copyLink(link) {
  navigator.clipboard.writeText(link).then(() => showToast('Onboarding link copied'));
}

function showToast(msg, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.style.background = isError ? 'var(--danger)' : 'var(--success)';
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 3000);
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Auto-refresh every 30s
setInterval(() => { if (adminKey) loadLeads(); }, 30000);
</script>
</body>
</html>

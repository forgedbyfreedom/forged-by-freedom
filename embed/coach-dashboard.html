<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FBF Coach Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0a;color:#fff;min-height:100vh}
.navbar{background:#141414;border-bottom:1px solid #2a2a2a;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.navbar h1{font-size:20px;color:#FF6A00;font-weight:800;letter-spacing:0.5px}
.navbar .nav-right{display:flex;gap:12px;align-items:center}
.container{max-width:1400px;margin:0 auto;padding:24px}
.auth-screen{display:flex;align-items:center;justify-content:center;min-height:80vh}
.auth-box{background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:48px;width:400px;text-align:center}
.auth-box h2{color:#FF6A00;margin-bottom:24px;font-size:22px}
.auth-box input{width:100%;padding:14px;background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;color:#fff;font-size:15px;margin-bottom:16px}
.auth-box input:focus{outline:none;border-color:#FF6A00}
.btn{background:#FF6A00;color:#fff;border:none;padding:12px 24px;border-radius:8px;font-weight:700;cursor:pointer;font-size:14px;transition:background 0.2s}
.btn:hover{background:#FF8533}
.btn-sm{padding:8px 16px;font-size:12px}
.btn-outline{background:transparent;border:1px solid #FF6A00;color:#FF6A00}
.btn-outline:hover{background:rgba(255,106,0,0.1)}
.btn-secondary{background:#2a2a2a;color:#888}.btn-secondary:hover{background:#333}

/* Client List */
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-top:24px}
.client-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:20px;cursor:pointer;transition:border-color 0.2s}
.client-card:hover{border-color:#FF6A00}
.client-card .name{font-size:16px;font-weight:700}
.client-card .email{font-size:12px;color:#888;margin-top:2px}
.client-card .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.client-card .stat{text-align:center;background:#0a0a0a;border-radius:8px;padding:8px 4px}
.client-card .stat .val{font-size:16px;font-weight:700}
.client-card .stat .lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.5px}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,197,94,0.15);color:#22c55e}
.badge-yellow{background:rgba(234,179,8,0.15);color:#eab308}
.badge-red{background:rgba(239,68,68,0.15);color:#ef4444}

/* Detail View */
.detail-view{display:none}
.back-btn{color:#FF6A00;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:20px;border:none;background:none;font-weight:600}
.detail-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:16px}
.detail-header h2{font-size:24px;font-weight:700}
.detail-header .actions{display:flex;gap:8px;flex-wrap:wrap}
.metrics-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:24px}
.metric-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:16px;text-align:center}
.metric-card .value{font-size:22px;font-weight:700}
.metric-card .label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.8px;margin-top:4px}
.metric-card .delta{font-size:12px;font-weight:600;margin-top:4px}
.delta-good{color:#22c55e}.delta-bad{color:#ef4444}

/* Charts Section */
.charts-section{margin-top:32px}
.chart-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chart-tab{padding:8px 14px;border-radius:8px;background:#141414;border:1px solid #2a2a2a;color:#888;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.chart-tab.active{background:#FF6A00;color:#fff;border-color:#FF6A00}
.chart-container{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:20px;height:350px;position:relative}
.period-selector{display:flex;gap:6px;margin-bottom:12px}
.period-btn{padding:6px 12px;border-radius:6px;background:#0a0a0a;border:1px solid #2a2a2a;color:#888;cursor:pointer;font-size:11px}
.period-btn.active{background:rgba(255,106,0,0.15);color:#FF6A00;border-color:#FF6A00}

/* Checkin Table */
.checkin-section{margin-top:32px}
.checkin-table{width:100%;border-collapse:collapse;margin-top:12px}
.checkin-table th{padding:10px 12px;text-align:left;font-size:11px;color:#888;text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid #2a2a2a;position:sticky;top:0;background:#0a0a0a}
.checkin-table td{padding:10px 12px;font-size:13px;border-bottom:1px solid #1a1a1a}
.checkin-table tr:hover td{background:#141414}
.table-wrap{max-height:400px;overflow-y:auto;border:1px solid #2a2a2a;border-radius:12px}

/* Body Comp Section */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:16px}
.comp-card{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:16px}
.comp-card .val{font-size:20px;font-weight:700;margin-top:4px}
.comp-card .lbl{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:0.8px}
.comp-card .change{font-size:12px;font-weight:600;margin-top:4px}

.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:#888}
.search-input{background:#0a0a0a;border:1px solid #2a2a2a;border-radius:8px;padding:10px 16px;color:#fff;font-size:14px;width:260px}
.search-input:focus{outline:none;border-color:#FF6A00}
@media(max-width:768px){.container{padding:12px}.client-grid{grid-template-columns:1fr}.metrics-row{grid-template-columns:repeat(2,1fr)}.chart-container{height:280px}}
</style>
</head>
<body>

<nav class="navbar">
  <h1>FBF COACH DASHBOARD</h1>
  <div class="nav-right">
    <input type="text" class="search-input" id="searchInput" placeholder="Search clients..." oninput="filterClients()" style="display:none">
    <button class="btn btn-sm btn-outline" id="logoutBtn" style="display:none" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- Auth Screen -->
<div class="auth-screen" id="authScreen">
  <div class="auth-box">
    <h2>Coach Login</h2>
    <input type="password" id="adminKeyInput" placeholder="Enter admin key" onkeydown="if(event.key==='Enter')authenticate()">
    <button class="btn" style="width:100%" onclick="authenticate()">Access Dashboard</button>
    <p id="authError" style="color:#ef4444;margin-top:12px;font-size:13px;display:none"></p>
  </div>
</div>

<!-- Client List View -->
<div class="container" id="clientList" style="display:none">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <h2 style="font-size:22px">Your Clients</h2>
    <span id="clientCount" style="color:#888;font-size:13px"></span>
  </div>
  <div class="client-grid" id="clientGrid"></div>
</div>

<!-- Client Detail View -->
<div class="container detail-view" id="detailView">
  <button class="back-btn" onclick="showList()">&#8592; Back to Clients</button>
  <div id="detailContent"></div>
</div>

<script>
let ADMIN_KEY = '';
let API_BASE = '';
let allClients = [];
let currentChart = null;

// Detect API base
(function() {
  const loc = window.location;
  API_BASE = loc.origin;
})();

function authenticate() {
  ADMIN_KEY = document.getElementById('adminKeyInput').value.trim();
  if (!ADMIN_KEY) return;
  document.getElementById('authError').style.display = 'none';
  loadClients();
}

async function loadClients() {
  try {
    const res = await fetch(`${API_BASE}/api/coach/clients?key=${ADMIN_KEY}`);
    if (!res.ok) {
      document.getElementById('authError').textContent = 'Invalid admin key';
      document.getElementById('authError').style.display = 'block';
      return;
    }
    const data = await res.json();
    allClients = data.clients || [];

    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('clientList').style.display = 'block';
    document.getElementById('searchInput').style.display = 'block';
    document.getElementById('logoutBtn').style.display = 'block';
    document.getElementById('clientCount').textContent = `${allClients.length} active clients`;

    renderClients(allClients);
  } catch (err) {
    document.getElementById('authError').textContent = 'Connection error';
    document.getElementById('authError').style.display = 'block';
  }
}

function renderClients(clients) {
  const grid = document.getElementById('clientGrid');
  grid.innerHTML = clients.map(c => {
    const m = c.metrics || {};
    const lc = c.latest_checkin || {};
    const status = m.status || 'neutral';
    return `
    <div class="client-card" onclick="showClient('${c.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <div class="name">${c.first_name} ${c.last_name}</div>
          <div class="email">${c.email || ''}</div>
        </div>
        <span class="badge badge-${status}">${status.toUpperCase()}</span>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="val">${lc.weight_lbs || c.last_weight || '--'}</div>
          <div class="lbl">Weight</div>
        </div>
        <div class="stat">
          <div class="val">${m.adherence_7d != null ? m.adherence_7d + '%' : '--'}</div>
          <div class="lbl">Adherence</div>
        </div>
        <div class="stat">
          <div class="val">${m.avg_calories_7d || '--'}</div>
          <div class="lbl">Avg Cal</div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function filterClients() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allClients.filter(c =>
    `${c.first_name} ${c.last_name} ${c.email}`.toLowerCase().includes(q)
  );
  renderClients(filtered);
}

function showList() {
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('clientList').style.display = 'block';
  if (currentChart) { currentChart.destroy(); currentChart = null; }
}

function logout() {
  ADMIN_KEY = '';
  allClients = [];
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('clientList').style.display = 'none';
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('searchInput').style.display = 'none';
  document.getElementById('logoutBtn').style.display = 'none';
  document.getElementById('adminKeyInput').value = '';
}

async function showClient(clientId) {
  document.getElementById('clientList').style.display = 'none';
  document.getElementById('detailView').style.display = 'block';
  document.getElementById('detailContent').innerHTML = '<div class="loading">Loading client data...</div>';

  try {
    const res = await fetch(`${API_BASE}/api/coach/clients/${clientId}?key=${ADMIN_KEY}`);
    const data = await res.json();
    renderClientDetail(data);
  } catch (err) {
    document.getElementById('detailContent').innerHTML = '<div class="loading">Error loading client</div>';
  }
}

function renderClientDetail(data) {
  const { client: c, checkins, scans, metrics: m } = data;
  const met = m || {};
  const latestScan = scans[0] || {};
  const firstScan = scans.length > 1 ? scans[scans.length - 1] : {};
  const latestCheckin = checkins[0] || {};

  // Calculate averages from checkins
  const vals = (key) => checkins.map(ci => ci[key]).filter(Boolean);
  const avg = (arr) => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '--';

  let html = `
  <div class="detail-header">
    <div>
      <h2>${c.first_name} ${c.last_name}</h2>
      <p style="color:#888;font-size:13px">${c.email || ''} ${c.phone ? '| ' + c.phone : ''}</p>
    </div>
    <div class="actions">
      <button class="btn btn-sm" onclick="generateReport('${c.id}', 30)">30-Day Report</button>
      <button class="btn btn-sm btn-outline" onclick="generateReport('${c.id}', 90)">90-Day Report</button>
    </div>
  </div>

  <div class="metrics-row">
    <div class="metric-card">
      <div class="value">${latestCheckin.weight_lbs || c.last_weight || '--'}</div>
      <div class="label">Weight (lbs)</div>
      ${met.weight_delta_7d ? `<div class="delta ${met.weight_delta_7d < 0 ? 'delta-good' : 'delta-bad'}">${met.weight_delta_7d > 0 ? '+' : ''}${met.weight_delta_7d} (7d)</div>` : ''}
    </div>
    <div class="metric-card">
      <div class="value">${latestScan.body_fat_pct != null ? latestScan.body_fat_pct + '%' : '--'}</div>
      <div class="label">Body Fat</div>
      ${latestScan.body_fat_pct != null && firstScan.body_fat_pct != null ? `<div class="delta ${latestScan.body_fat_pct < firstScan.body_fat_pct ? 'delta-good' : 'delta-bad'}">${(latestScan.body_fat_pct - firstScan.body_fat_pct).toFixed(1)}%</div>` : ''}
    </div>
    <div class="metric-card">
      <div class="value">${met.adherence_7d != null ? met.adherence_7d + '%' : '--'}</div>
      <div class="label">Adherence (7d)</div>
    </div>
    <div class="metric-card">
      <div class="value">${avg(vals('calories'))}</div>
      <div class="label">Avg Calories</div>
      ${c.target_calories ? `<div class="delta" style="color:#888">/ ${c.target_calories}</div>` : ''}
    </div>
    <div class="metric-card">
      <div class="value">${avg(vals('protein_g'))}g</div>
      <div class="label">Avg Protein</div>
      ${c.target_protein ? `<div class="delta" style="color:#888">/ ${c.target_protein}g</div>` : ''}
    </div>
    <div class="metric-card">
      <div class="value">${avg(vals('sleep_hours'))}h</div>
      <div class="label">Avg Sleep</div>
    </div>
    <div class="metric-card">
      <div class="value">${avg(vals('steps'))}</div>
      <div class="label">Avg Steps</div>
    </div>
    <div class="metric-card">
      <div class="value"><span class="badge badge-${met.status || 'neutral'}">${(met.status || 'N/A').toUpperCase()}</span></div>
      <div class="label">Status</div>
    </div>
  </div>`;

  // Body Composition
  if (scans.length > 0) {
    html += `
    <div class="charts-section">
      <h3 style="font-size:18px;margin-bottom:12px">Body Composition</h3>
      <div class="comp-grid">
        ${latestScan.body_fat_pct != null ? `<div class="comp-card"><div class="lbl">Body Fat %</div><div class="val">${latestScan.body_fat_pct}%</div>${firstScan.body_fat_pct != null ? `<div class="change ${latestScan.body_fat_pct < firstScan.body_fat_pct ? 'delta-good' : 'delta-bad'}">${(latestScan.body_fat_pct - firstScan.body_fat_pct).toFixed(1)}% change</div>` : ''}</div>` : ''}
        ${latestScan.lean_mass_lbs != null ? `<div class="comp-card"><div class="lbl">Lean Mass</div><div class="val">${latestScan.lean_mass_lbs} lbs</div>${firstScan.lean_mass_lbs != null ? `<div class="change ${latestScan.lean_mass_lbs > firstScan.lean_mass_lbs ? 'delta-good' : 'delta-bad'}">${(latestScan.lean_mass_lbs - firstScan.lean_mass_lbs).toFixed(1)} lbs</div>` : ''}</div>` : ''}
        ${latestScan.skeletal_muscle_mass_lbs != null ? `<div class="comp-card"><div class="lbl">Skeletal Muscle</div><div class="val">${latestScan.skeletal_muscle_mass_lbs} lbs</div>${firstScan.skeletal_muscle_mass_lbs != null ? `<div class="change ${latestScan.skeletal_muscle_mass_lbs > firstScan.skeletal_muscle_mass_lbs ? 'delta-good' : 'delta-bad'}">${(latestScan.skeletal_muscle_mass_lbs - firstScan.skeletal_muscle_mass_lbs).toFixed(1)} lbs</div>` : ''}</div>` : ''}
        ${latestScan.fat_mass_lbs != null ? `<div class="comp-card"><div class="lbl">Fat Mass</div><div class="val">${latestScan.fat_mass_lbs} lbs</div>${firstScan.fat_mass_lbs != null ? `<div class="change ${latestScan.fat_mass_lbs < firstScan.fat_mass_lbs ? 'delta-good' : 'delta-bad'}">${(latestScan.fat_mass_lbs - firstScan.fat_mass_lbs).toFixed(1)} lbs</div>` : ''}</div>` : ''}
        ${latestScan.basal_metabolic_rate != null ? `<div class="comp-card"><div class="lbl">BMR</div><div class="val">${latestScan.basal_metabolic_rate} cal</div></div>` : ''}
        ${latestScan.visceral_fat_level != null ? `<div class="comp-card"><div class="lbl">Visceral Fat</div><div class="val">${latestScan.visceral_fat_level}</div></div>` : ''}
      </div>
    </div>`;
  }

  // Charts
  html += `
  <div class="charts-section">
    <h3 style="font-size:18px;margin-bottom:12px">Trends</h3>
    <div class="period-selector">
      <button class="period-btn active" onclick="loadTrends('${data.client.id}', 14, this)">14d</button>
      <button class="period-btn" onclick="loadTrends('${data.client.id}', 30, this)">30d</button>
      <button class="period-btn" onclick="loadTrends('${data.client.id}', 60, this)">60d</button>
      <button class="period-btn" onclick="loadTrends('${data.client.id}', 90, this)">90d</button>
    </div>
    <div class="chart-tabs">
      <div class="chart-tab active" data-metric="weight_lbs" onclick="switchMetric(this)">Weight</div>
      <div class="chart-tab" data-metric="calories" onclick="switchMetric(this)">Calories</div>
      <div class="chart-tab" data-metric="protein_g" onclick="switchMetric(this)">Protein</div>
      <div class="chart-tab" data-metric="steps" onclick="switchMetric(this)">Steps</div>
      <div class="chart-tab" data-metric="sleep_hours" onclick="switchMetric(this)">Sleep</div>
      <div class="chart-tab" data-metric="mood_rating" onclick="switchMetric(this)">Mood</div>
      <div class="chart-tab" data-metric="body_temp" onclick="switchMetric(this)">Body Temp</div>
      <div class="chart-tab" data-metric="blood_glucose" onclick="switchMetric(this)">Glucose</div>
      <div class="chart-tab" data-metric="blood_pressure_systolic" onclick="switchMetric(this)">BP</div>
      <div class="chart-tab" data-metric="resting_heart_rate" onclick="switchMetric(this)">Heart Rate</div>
      <div class="chart-tab" data-metric="stress_level" onclick="switchMetric(this)">Stress</div>
      <div class="chart-tab" data-metric="water_oz" onclick="switchMetric(this)">Water</div>
    </div>
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>`;

  // Check-in table
  html += `
  <div class="checkin-section">
    <h3 style="font-size:18px;margin-bottom:12px">Check-in History</h3>
    <div class="table-wrap">
      <table class="checkin-table">
        <thead>
          <tr>
            <th>Date</th><th>Weight</th><th>Cal</th><th>Protein</th><th>Carbs</th><th>Fat</th>
            <th>Sleep</th><th>Steps</th><th>Mood</th><th>Stress</th><th>Temp</th><th>Train</th><th>Supps</th>
          </tr>
        </thead>
        <tbody>
          ${checkins.map(ci => `
          <tr>
            <td>${new Date(ci.date).toLocaleDateString('en-US', {month:'short',day:'numeric'})}</td>
            <td>${ci.weight_lbs || '--'}</td>
            <td>${ci.calories || '--'}</td>
            <td>${ci.protein_g ? ci.protein_g+'g' : '--'}</td>
            <td>${ci.carbs_g ? ci.carbs_g+'g' : '--'}</td>
            <td>${ci.fat_g ? ci.fat_g+'g' : '--'}</td>
            <td>${ci.sleep_hours ? ci.sleep_hours+'h' : '--'}</td>
            <td>${ci.steps ? ci.steps.toLocaleString() : '--'}</td>
            <td>${ci.mood_rating || '--'}</td>
            <td>${ci.stress_level || '--'}</td>
            <td>${ci.body_temp || '--'}</td>
            <td>${ci.training_done ? '&#10003;' : '&mdash;'}</td>
            <td>${ci.supplement_compliance ? '&#10003;' : '&mdash;'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;

  document.getElementById('detailContent').innerHTML = html;

  // Store checkins for chart use
  window._currentCheckins = checkins;
  window._currentClientId = data.client.id;

  // Load initial chart
  loadTrends(data.client.id, 14);
}

let _trendData = [];

async function loadTrends(clientId, days, btnEl) {
  // Update period button styles
  if (btnEl) {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
  }

  try {
    const res = await fetch(`${API_BASE}/api/coach/clients/${clientId}/trends?key=${ADMIN_KEY}&days=${days}`);
    const data = await res.json();
    _trendData = data.checkins || [];

    // Get active metric
    const activeTab = document.querySelector('.chart-tab.active');
    const metric = activeTab ? activeTab.dataset.metric : 'weight_lbs';
    renderChart(metric);
  } catch {}
}

function switchMetric(el) {
  document.querySelectorAll('.chart-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderChart(el.dataset.metric);
}

const METRIC_LABELS = {
  weight_lbs: 'Weight (lbs)',
  calories: 'Calories',
  protein_g: 'Protein (g)',
  steps: 'Steps',
  sleep_hours: 'Sleep (hrs)',
  mood_rating: 'Mood (1-10)',
  body_temp: 'Body Temp (°F)',
  blood_glucose: 'Blood Glucose (mg/dL)',
  blood_pressure_systolic: 'Blood Pressure (systolic)',
  resting_heart_rate: 'Resting HR (bpm)',
  stress_level: 'Stress (1-10)',
  water_oz: 'Water (oz)',
};

const METRIC_COLORS = {
  weight_lbs: '#FF6A00',
  calories: '#eab308',
  protein_g: '#22c55e',
  steps: '#3b82f6',
  sleep_hours: '#8b5cf6',
  mood_rating: '#06b6d4',
  body_temp: '#ef4444',
  blood_glucose: '#f59e0b',
  blood_pressure_systolic: '#ec4899',
  resting_heart_rate: '#ef4444',
  stress_level: '#f97316',
  water_oz: '#0ea5e9',
};

function renderChart(metric) {
  const canvas = document.getElementById('trendChart');
  if (!canvas) return;
  if (currentChart) currentChart.destroy();

  const filtered = _trendData.filter(c => c[metric] != null);
  const labels = filtered.map(c => new Date(c.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }));
  const values = filtered.map(c => c[metric]);
  const color = METRIC_COLORS[metric] || '#FF6A00';

  currentChart = new Chart(canvas, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: METRIC_LABELS[metric] || metric,
        data: values,
        borderColor: color,
        backgroundColor: color + '20',
        fill: true,
        tension: 0.3,
        pointRadius: 3,
        pointHoverRadius: 6,
        borderWidth: 2,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#141414',
          titleColor: '#fff',
          bodyColor: '#fff',
          borderColor: '#2a2a2a',
          borderWidth: 1,
        }
      },
      scales: {
        x: {
          grid: { color: '#1a1a1a' },
          ticks: { color: '#888', font: { size: 11 }, maxRotation: 45 }
        },
        y: {
          grid: { color: '#1a1a1a' },
          ticks: { color: '#888', font: { size: 11 } }
        }
      }
    }
  });
}

function generateReport(clientId, days) {
  window.open(`${API_BASE}/api/coach/clients/${clientId}/report?key=${ADMIN_KEY}&days=${days}`, '_blank');
}
</script>
</body>
</html>
